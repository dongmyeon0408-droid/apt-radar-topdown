name: 시세 자동 갱신

# 매달 5일 새벽 3시(한국시간)에 실행. 수동 실행도 가능합니다.
on:
  schedule:
    - cron: '0 18 4 * *'      # UTC 18:00 = 한국 새벽 3시
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 최근 4개월 시세 갱신
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: node tools/update.js 4

      # update.js 가 중단(exit 1)하면 여기까지 오지 않으므로,
      # 점검을 통과한 결과만 커밋된다.
      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  "apt-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain market-data.js raw-agg.json)" ]; then
            git add market-data.js raw-agg.json
            git commit -m "시세 자동 갱신 $(date +%Y-%m)"
            git push
            echo "갱신 완료"
          else
            echo "바뀐 내용 없음"
          fi

      - name: 실패하면 이슈로 알림
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `시세 자동 갱신 실패 (${new Date().toISOString().slice(0,10)})`,
              body: [
                '월간 시세 갱신이 점검에서 걸렸거나 오류로 멈췄습니다.',
                '',
                `자세한 기록: ${run}`,
                '',
                '**확인할 것**',
                '- API 키가 만료되지 않았는지 (2028-08-08 까지)',
                '- 하루 호출 한도(10만)를 넘지 않았는지',
                '- 행정구역이 개편되지 않았는지 → `node tools/map-codes.js`',
                '',
                '점검에서 걸린 경우 데이터 파일은 바뀌지 않았으니, 앱은 이전 자료로 정상 동작합니다.'
              ].join('\n')
            });
